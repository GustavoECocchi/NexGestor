# NexGestor — Backend no VPS, atrás de um proxy que JÁ EXISTE no servidor.
#
# Verificado de fora em 14/08/2026: quem responde em 80/443 no VPS é um nginx
# (header `Server: nginx/1.24.0 (Ubuntu)`), com o certificado já emitido. Por
# isso aqui sobe SÓ o backend, em 127.0.0.1:8000 — alcançável pelo proxy do
# próprio servidor, invisível pra internet.
#
# ⚠️ NÃO confirmado: se o backend hoje no ar foi subido por ESTE compose ou de
#    outro jeito (uvicorn/systemd, por exemplo). Isso só dá pra saber de dentro
#    do VPS. Se já houver um backend escutando na 8000, `docker compose up`
#    falha ao reservar a porta — o erro é claro e nada é sobrescrito.
#
# Se um dia o servidor NÃO tiver proxy nenhum, use o docker-compose.caddy.yml
# (sobe um Caddy que toma 80/443 e emite o certificado sozinho). Os dois não
# podem rodar juntos: brigariam pela porta 443.
#
# Uso (dentro da pasta deploy/):
#   cp .env.example .env         # depois edite o .env com a chave do Gemini
#   docker compose up -d --build
#
# Ver logs:      docker compose logs -f
# Atualizar:     git pull && docker compose up -d --build
# Parar:         docker compose down

services:
  api:
    build:
      context: ../backend/backend-nexgestor-main
      dockerfile: Dockerfile
    restart: unless-stopped
    # Configurações (chave do Gemini, CORS, etc.) vêm do .env — NUNCA ficam
    # gravadas na imagem. O .env fica só no VPS e está no .gitignore.
    env_file:
      - .env
    # 127.0.0.1 é intencional: só o proxy do próprio servidor alcança.
    # Trocar por "8000:8000" exporia o backend direto na internet, sem HTTPS.
    ports:
      - "127.0.0.1:8000:8000"
    # Banco das campanhas salvas. SEM este volume o arquivo vive dentro do
    # container e some no próximo `up -d --build` — perderíamos exatamente o
    # dado que a persistência existe para proteger.
    environment:
      DB_PATH: /dados/nexgestor.db
    volumes:
      - nexgestor-dados:/dados

volumes:
  # Backup: `docker run --rm -v nexgestor-dados:/d -v $PWD:/b alpine \
  #            cp /d/nexgestor.db /b/` (com o serviço parado, ou copiando
  #            também os arquivos -wal/-shm que o WAL cria).
  nexgestor-dados:
